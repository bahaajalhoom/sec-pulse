<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96" fill="none">
  <title>SecuriPulse Logo</title>
  <!-- Brand Symbol (Shield + Pulse) -->
  <g transform="translate(8, 8) scale(0.3125)">
    <!-- Outer Defensive Shield Perimeter (scaled from 256) -->
    <path d="M128 24 L48 54 V126 C48 180 82 226 128 238 C174 226 208 180 208 126 V54 Z" 
          stroke="#1677ff" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Inner Telemetry Heartbeat / Pulse -->
    <path d="M64 128 H96 L112 156 L128 72 L144 156 L160 128 H192" 
          stroke="#13c2c2" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <circle cx="128" cy="72" r="5" fill="#13c2c2"/>
  </g>

  <!-- Typography: SecuriPulse -->
  <text x="104" y="52" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">
    Securi<tspan fill="#1677ff">Pulse</tspan>
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="105" y="74" fill="#8c8c8c" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="1.2">
    DEVSEC TELEMETRY &amp; AUDITOR
  </text>
</svg>
